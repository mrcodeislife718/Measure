<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Measure</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><header class="nav"><a class="brand" href="/">Measure</a></header><section class="hero compact"><p class="eyebrow">CONTACT</p><h1>Reach Measure privately.</h1><p>Use this form for sales, support, billing, privacy, or security matters. Do not put secrets, passwords, API keys, regulated data, or production credentials in the message.</p></section><section class="panel"><form id="contact-form" class="stack"><input name="email" type="email" placeholder="Email" required><select name="category"><option value="sales">Sales</option><option value="support">Support</option><option value="billing">Billing</option><option value="privacy">Privacy</option><option value="security">Security</option><option value="general">General</option></select><input name="subject" placeholder="Subject" required><textarea name="message" rows="10" placeholder="How can Measure help?" minlength="10" required></textarea><button class="button" type="submit">Send message</button><pre id="contact-result" class="result"></pre></form></section></main><script type="module" src="/contact.js"></script></body></html>
